name: CI - Kasbuka

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kasbuka
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/kasbuka
      DIRECT_URL: postgresql://postgres:postgres@localhost:5433/kasbuka
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5433/kasbuka_test
      AUTH_SECRET: kasbuka_super_secret_auth_session_key_minimum_32_characters_long
      MIDTRANS_SERVER_KEY: SB-Mid-server-test-placeholder
      MIDTRANS_CLIENT_KEY: SB-Mid-client-test-placeholder
      MIDTRANS_IS_PRODUCTION: 'false'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'package.json'

      - name: Create Test Database
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -c "CREATE DATABASE kasbuka_test;" || true

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Deploy Prisma Migrations
        run: |
          npx prisma migrate deploy
          DATABASE_URL=postgresql://postgres:postgres@localhost:5433/kasbuka_test DIRECT_URL=postgresql://postgres:postgres@localhost:5433/kasbuka_test npx prisma migrate deploy

      - name: Run ESLint
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Unit & Postgres Integration Tests (Vitest)
        run: npm run test

      - name: Build Next.js
        run: npm run build
